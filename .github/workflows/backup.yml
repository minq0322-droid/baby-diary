name: Backup

on:
  # GitHub delays or drops scheduled runs under load, worst at the top of the hour.
  # So: off-the-hour minute, plus four retries (04:17 · 06:47 · 08:17 · 10:47 · 12:17 KST).
  # Once today's backup exists, the later runs end right away.
  schedule:
    - cron: '17 19 * * *'
    - cron: '47 21 * * *'
    - cron: '17 23 * * *'
    - cron: '47 1 * * *'
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Public repos lose scheduled workflows after 60 days without activity; re-enabling resets that clock.
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/backup.yml/enable" || true
      - name: Check out app source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: app
          ref: ${{ github.event.repository.default_branch }}
      - name: Check out backups branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0
          path: out
          ref: backups
      - name: Create backups branch if missing
        run: |
          mkdir -p out
          if ! git -C out rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C out init
            git -C out checkout --orphan backups
            git -C out config remote.origin.url "https://github.com/${{ github.repository }}.git"
          fi
      - name: Skip if today's backup already exists
        id: done
        run: |
          if [ "${{ github.event_name }}" = schedule ] && [ -f "out/encrypted/$(TZ=Asia/Seoul date +%F).enc" ]; then
            echo "Today's backup already exists"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.done.outputs.skip != 'true'
        with:
          node-version: 22
      - name: Install dependencies
        if: steps.done.outputs.skip != 'true'
        working-directory: app
        run: npm ci
      - name: Create backup
        if: steps.done.outputs.skip != 'true'
        working-directory: app
        env:
          OUT_DIR: ${{ runner.temp }}/diary-backup
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BACKUP_JOIN_TOKEN: ${{ secrets.BACKUP_JOIN_TOKEN }}
        run: npm run backup
      - name: Encrypt private diary before publishing to public backup branch
        if: steps.done.outputs.skip != 'true'
        working-directory: app
        env:
          BACKUP_JOIN_TOKEN: ${{ secrets.BACKUP_JOIN_TOKEN }}
        run: node scripts/backup/encrypt.mjs encrypt "$RUNNER_TEMP/diary-backup" "$GITHUB_WORKSPACE/out/encrypted/$(TZ=Asia/Seoul date +%F).enc"
      - name: Commit and push changes
        if: steps.done.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C out config user.name "github-actions[bot]"
          git -C out config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C out add encrypted
          if ! git -C out diff --cached --quiet; then
            git -C out commit -m "backup $(TZ=Asia/Seoul date +%F)"
            git -C out push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:backups
          fi
