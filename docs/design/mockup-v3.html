<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6F5F2">
  <title>아이들의 하루 — 목업 v3</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
  <style>
    :root {
      color-scheme: light;
      --bg: #F6F5F2; --surface: #FFFFFF; --raised: #F6F5F2;
      --text: #1E1F24; --sub: #74757C; --line: #E6E4DF;
      --primary: #1E1F24; --on-primary: #FFFFFF;
      --cherry: #F4B9B8; --apricot: #FFCBA4; --lemon: #FFEB8A; --pahha: #CDEFE2;
      --lime: #CFE6A0; --sky: #A9D8F5; --lilac: #D8CBF3; --paper: #F4EBDD;
      --orange: #F59157; --tomato: #EE6A5A; --forsythia: #FFD23F; --mint: #8FDCC2;
      --blue: #7CC7F5; --lavender: #B8A4F2; --forest: #0F4D3A; --night: #2E3550;
      --dark-ink: #1E2326; --light-ink: #F5F0E1; --page-ink: var(--dark-ink);
      --scrim: #1E1F2438; --ease: cubic-bezier(.2,.8,.2,1);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #262638; --surface: #31314A; --raised: #3B3B57;
        --text: #F1F0F7; --sub: #A9A8BE; --line: #46465F;
        --primary: #F1F0F7; --on-primary: #262638; --page-ink: var(--light-ink);
        --cherry:#8E5154; --apricot:#94613D; --lemon:#806B22; --pahha:#3F7868;
        --lime:#536E2B; --sky:#3F6F8D; --lilac:#645580; --paper:#776B55;
        --orange:#98512B; --tomato:#963D35; --forsythia:#80651C; --mint:#34715E;
        --blue:#3E7695; --lavender:#594785; --forest:#0F4D3A; --night:#2E3550;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #262638; --surface: #31314A; --raised: #3B3B57;
      --text: #F1F0F7; --sub: #A9A8BE; --line: #46465F;
      --primary: #F1F0F7; --on-primary: #262638; --page-ink: var(--light-ink);
      --cherry:#8E5154; --apricot:#94613D; --lemon:#806B22; --pahha:#3F7868;
      --lime:#536E2B; --sky:#3F6F8D; --lilac:#645580; --paper:#776B55;
      --orange:#98512B; --tomato:#963D35; --forsythia:#80651C; --mint:#34715E;
      --blue:#3E7695; --lavender:#594785; --forest:#0F4D3A; --night:#2E3550;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 24px 72px; background: var(--bg); color: var(--text); font: 15px/1.5 Pretendard, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    h1, h2, h3, p, figure { margin: 0; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { border: 0; background: none; min-width: 44px; min-height: 44px; padding: 8px; cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    svg { fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    .icon { width: 24px; height: 24px; display: inline-block; vertical-align: middle; flex: none; }
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .intro, .phones { max-width: 1197px; margin-inline: auto; }
    .intro { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-bottom: 36px; }
    .eyebrow { color: var(--sub); font-size: 13px; margin-bottom: 5px; }
    .intro h1 { font-size: 28px; letter-spacing: -.045em; line-height: 1.4; }
    .intro p { color: var(--sub); margin-top: 9px; }
    .theme-switch { display: flex; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 30px; }
    .theme-switch button { font-size: 13px; padding-inline: 16px; border-radius: 24px; }
    .theme-switch [aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
    .phones { display: grid; grid-template-columns: repeat(3, 375px); gap: 36px; align-items: start; }
    figcaption { margin: 0 0 12px 5px; font-size: 13px; color: var(--sub); display: flex; gap: 10px; }
    figcaption b { color: var(--text); font-weight: 600; }
    .phone { width: 375px; height: 860px; border: 1px solid var(--line); border-radius: 38px; overflow: hidden; position: relative; background: var(--bg); isolation: isolate; box-shadow: 0 12px 36px color-mix(in srgb, var(--text) 7%, transparent); }
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
    .status { height: 43px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: calc(8px + env(safe-area-inset-top, 0px)) 25px 5px; font-size: 13px; font-weight: 600; }
    .island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 84px; height: 19px; border-radius: 24px; background: currentColor; }
    .scroll { overflow: auto; scrollbar-width: none; flex: 1; padding: 16px 22px; }
    .scroll::-webkit-scrollbar { display: none; }
    .home-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .meta { color: var(--sub); font-size: 13px; }
    .greeting { font-size: 28px; font-weight: 700; letter-spacing: -.06em; line-height: 1.3; margin-top: 6px; }
    .avatar { background: var(--surface); border: 1px solid var(--line); border-radius: 50%; width: 49px; height: 49px; flex: none; font-size: 13px; }
    .date-switch { display: flex; align-items: center; margin: 8px 0 6px -8px; font-size: 13px; width: fit-content; }
    .date-switch button { padding: 4px; }
    .date-switch span { min-width: 35px; text-align: center; }
    .kids { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .kid-card { height: 232px; border-radius: 25px; text-align: left; padding: 18px 15px; position: relative; display: flex; flex-direction: column; align-items: flex-start; overflow: hidden; }
    .page-color { background: var(--page-color); color: var(--page-ink); }
    [data-color="forest"], [data-color="night"] { --page-ink: var(--light-ink); }
    .kid-art { width: 94px; height: 106px; margin: 2px auto 4px; stroke-width: 1.3; transform: rotate(-8deg); }
    .kid-card h3 { font-size: 20px; letter-spacing: -.04em; margin-top: auto; }
    .kid-card .age { font-size: 13px; margin-top: 2px; opacity: .75; }
    .kid-status { font-size: 13px; margin-top: 12px; display: flex; justify-content: space-between; gap: 3px; width: 100%; align-items: center; letter-spacing: -.045em; }
    .kid-status .icon { width: 16px; height: 16px; }
    .empty-art { opacity: .4; }
    .search { display: flex; align-items: center; gap: 9px; padding: 0 16px; margin: 16px 0; border: 1px solid var(--line); border-radius: 30px; background: var(--surface); color: var(--sub); min-height: 48px; }
    .search .icon { width: 19px; height: 19px; }
    .search input { border: 0; background: none; min-width: 0; width: 100%; height: 46px; outline: none; font-size: 15px; }
    input::placeholder, textarea::placeholder { color: inherit; opacity: .6; }
    .section-head { display: flex; align-items: center; justify-content: space-between; }
    h2 { font-size: 17px; letter-spacing: -.03em; }
    .section-head button { font-size: 13px; color: var(--sub); padding-right: 0; }
    .segments { display: flex; gap: 5px; margin-bottom: 8px; }
    .segments button { border-radius: 24px; padding: 7px 16px; font-size: 13px; color: var(--sub); }
    .segments [aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
    .recent-row { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin-right: -22px; padding-right: 22px; }
    .page-card { flex: 0 0 157px; height: 181px; border-radius: 21px; overflow: hidden; text-align: left; padding: 13px; position: relative; display: flex; flex-direction: column; align-items: flex-start; }
    .page-card > .icon { width: 77px; height: 90px; margin: 3px auto; stroke-width: 1.3; }
    .drawing-preview { object-fit: contain; }
    .page-card > .drawing-preview { width: 100%; height: 100px; margin: -4px auto; }
    .preview-kids .page-card > .drawing-preview { height: 80px; }
    .card-label { margin: auto -13px -13px; padding: 10px 13px 12px; width: calc(100% + 26px); background: color-mix(in srgb, var(--page-color) 78%, var(--page-ink) 8%); }
    .card-label small { font-size: 13px; opacity: .7; }
    .card-label p { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
    .mini-badge { position: absolute; top: 10px; right: 11px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; }
    .mini-badge .icon { width: 19px; height: 19px; }
    .tabbar { min-height: 78px; padding: 8px 26px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; background: var(--surface); border-top: 1px solid var(--line); flex: none; }
    .tab { width: 66px; font-size: 11px; color: var(--sub); display: flex; flex-direction: column; gap: 2px; align-items: center; position: relative; }
    .tab.on { color: var(--text); }
    .tab.on::after { content: ''; width: 4px; height: 4px; border-radius: 50%; background: currentColor; position: absolute; bottom: 0; }
    .primary { background: var(--primary); color: var(--on-primary); border-radius: 18px; padding: 12px 20px; font-weight: 600; }
    .diary { font-family: Gaegu, cursive; font-size: 20px; background: var(--page-color); color: var(--page-ink); }
    .diary .status { font-family: Pretendard, sans-serif; font-weight: 500; }
    .diary-head { display: flex; align-items: center; justify-content: space-between; padding: 0 14px; height: 53px; flex: none; }
    .diary-date { display: flex; align-items: center; font-size: 20px; }
    .diary-date button { padding: 0; width: 44px; }
    .diary-date .icon { width: 14px; height: 14px; }
    .badge-button { position: relative; }
    .badge-button .icon { width: 29px; height: 29px; }
    .badge-button.chosen svg { fill: currentColor; fill-opacity: .23; }
    .badge-count { font-size: 13px; position: absolute; right: 0; top: 0; }
    .art { margin: 0 18px; height: 335px; flex: none; position: relative; }
    .art canvas { width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: pointer; }
    .art.drawing canvas { touch-action: none; cursor: crosshair; }
    .art.empty::after { content: '여기에 그리거나 사진을 붙여요'; position: absolute; inset: 25px 12px 35px; border: 1px dashed currentColor; border-radius: 48% 44% 7% 6% / 5% 4% 6% 5%; opacity: .42; display: flex; justify-content: center; align-items: end; padding-bottom: 25px; pointer-events: none; font-size: 17px; }
    .writing { margin: 9px 29px 0; min-height: 176px; flex: 1; overflow: auto; scrollbar-width: none; }
    .notes { background: repeating-linear-gradient(to bottom, transparent 0, transparent 34px, color-mix(in srgb, currentColor 10%, transparent) 34px, color-mix(in srgb, currentColor 10%, transparent) 35px); min-height: 175px; }
    .note { line-height: 35px; margin-bottom: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .initial { opacity: .5; font-size: 13px; margin-left: 7px; }
    .note-block { position: relative; margin-bottom: 14px; }
    .note-block > .initial { position: absolute; right: 1px; bottom: 4px; }
    .dad-writing { font-family: var(--dad-font, Gaegu), cursive; }
    .mom-writing { font-family: var(--mom-font, Gaegu), cursive; }
    .second-note { min-height: 70px; }
    .note-editor { display: block; resize: none; border: 0; background: none; width: 100%; min-height: 90px; padding: 0; font-size: 20px; line-height: 35px; }
    .diary-bottom { height: 101px; flex: none; padding: 10px 24px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; }
    .comment-button { justify-self: start; display: flex; align-items: center; gap: 5px; padding-left: 0; }
    .oval { width: 88px; height: 65px; border: 1.5px solid currentColor; border-radius: 47% 53% 48% 49% / 48% 44% 56% 52%; font-size: 20px; transform: rotate(-5deg); justify-self: center; }
    .oval span { display: block; transform: rotate(5deg); }
    .tray { position: absolute; bottom: 4px; left: -6px; right: -6px; min-height: 58px; padding: 3px; display: flex; justify-content: space-between; overflow-x: auto; scrollbar-width: none; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); border-radius: 17px; background: color-mix(in srgb, var(--page-color) 88%, var(--light-ink)); z-index: 2; }
    .tray button { font-size: 13px; padding: 3px 2px; min-width: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .tray .icon { width: 21px; height: 21px; }
    .tray [aria-pressed="true"] { border-radius: 12px; background: color-mix(in srgb, currentColor 12%, transparent); }
    .tray .pen-small .icon { width: 16px; height: 16px; }
    .sheet-layer { position: absolute; inset: 0; z-index: 10; background: var(--scrim); display: flex; align-items: flex-end; }
    .sheet { width: 100%; max-height: 80%; overflow: auto; border-radius: 29px 29px 0 0; background: var(--surface); color: var(--text); padding: 10px 22px calc(24px + env(safe-area-inset-bottom, 0px)); animation: sheet-in 340ms cubic-bezier(.22,1.2,.36,1); }
    .diary .sheet { background: var(--page-color); color: var(--page-ink); }
    .handle { width: 33px; height: 3px; border-radius: 3px; background: currentColor; opacity: .25; margin: 0 auto 12px; }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .sheet-head h3 { font-size: 20px; font-weight: 400; }
    .sheet-head button { font-size: 17px; }
    .comment { padding: 13px 0; border-bottom: 1px solid color-mix(in srgb, currentColor 13%, transparent); }
    .comment-author { font-size: 15px; opacity: .65; }
    .comment p { font-size: 20px; margin-top: 3px; }
    .heart-toggle { margin: 6px 0; font-size: 17px; }
    .heart-toggle[aria-pressed="true"] .icon { fill: currentColor; }
    .comment-form { display: flex; gap: 7px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); border-radius: 24px; padding: 0 3px 0 15px; }
    .comment-form input { background: none; border: 0; min-width: 0; width: 100%; outline: none; font-size: 20px; }
    .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 6px; padding: 8px 0 14px; }
    .sticker { min-height: 89px; font-size: 17px; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; }
    .sticker-art { display: grid; place-items: center; width: 49px; height: 46px; border-radius: 48% 52% 46% 54%; border: 1px solid color-mix(in srgb, currentColor 25%, transparent); transform: rotate(-5deg); }
    .sticker:nth-child(even) .sticker-art { transform: rotate(6deg); }
    .sticker-art svg { width: 29px; height: 29px; }
    .sticker[aria-pressed="true"] .sticker-art { background: var(--page-ink); color: var(--page-color); border-color: var(--page-ink); }
    .sticker[aria-pressed="true"]::after { content: '✓'; position: absolute; top: 1px; right: 12px; font-size: 15px; }
    .sheet-done { width: 100%; border: 1px solid currentColor; border-radius: 48% 51% 47% 52% / 14% 18% 19% 17%; font-size: 20px; margin-top: 8px; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
    .swatch { font-size: 15px; display: flex; flex-direction: column; align-items: center; padding: 5px; gap: 4px; }
    .swatch { --page-ink: var(--palette-ink, #1E2326); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --palette-ink: #F5F0E1; } }
    :root[data-theme="dark"] { --palette-ink: #F5F0E1; }
    .swatch-dot { width: 38px; height: 35px; border-radius: 47% 53% 45% 55%; background: var(--page-color); border: 1px solid color-mix(in srgb, var(--page-ink) 30%, transparent); display: grid; place-items: center; color: var(--page-ink); }
    .screen-title { font-size: 28px; letter-spacing: -.045em; margin: 2px 0 28px; }
    .month-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .month-nav h2 { font-size: 20px; }
    .weekdays, .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
    .weekdays { color: var(--sub); font-size: 13px; margin-bottom: 12px; }
    .day { min-width: 0; height: 53px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
    .day-num { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; }
    .day.today .day-num { background: var(--primary); color: var(--on-primary); }
    .day.selected:not(.today) .day-num { outline: 1px solid var(--sub); }
    .dots { display: flex; gap: 3px; height: 4px; }
    .dot { width: 4px; height: 4px; border-radius: 50%; display: block; }
    .legend { display: flex; gap: 16px; align-items: center; font-size: 13px; color: var(--sub); margin: 20px 0 30px; }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .legend .dot { width: 7px; height: 7px; }
    .day-preview { background: var(--surface); border: 1px solid var(--line); border-radius: 25px; padding: 17px; }
    .day-preview h2 { margin-bottom: 13px; }
    .preview-kids { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .preview-kids .page-card { width: 100%; height: 167px; min-width: 0; }
    .preview-kids .page-card > .icon { height: 65px; }
    .settings-group { margin-bottom: 24px; }
    .settings-group h2 { margin: 0 0 9px 4px; font-size: 13px; color: var(--sub); font-weight: 500; }
    .settings-list { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
    .setting { width: 100%; display: flex; align-items: center; justify-content: space-between; text-align: left; min-height: 59px; padding: 12px 16px; gap: 12px; border-bottom: 1px solid var(--line); font-size: 15px; }
    .setting:last-child { border: 0; }
    .setting small { font-size: 13px; color: var(--sub); display: block; margin-top: 2px; }
    .setting .icon { width: 16px; height: 16px; color: var(--sub); }
    .setting .colors { display: flex; gap: 5px; }
    .setting .colors i { width: 17px; height: 17px; border-radius: 50%; }
    .setting-select { border: 0; background: var(--raised); border-radius: 10px; min-height: 44px; font-size: 13px; padding: 7px; max-width: 140px; }
    .toast { position: absolute; left: 50%; bottom: 99px; transform: translateX(-50%); padding: 12px 22px; border-radius: 25px; background: var(--primary); color: var(--on-primary); font: 15px Pretendard, sans-serif; white-space: nowrap; z-index: 30; animation: toast-in 250ms var(--ease); }
    .archive-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .archive-grid .page-card { width: 100%; min-width: 0; }
    .back-title { display: flex; align-items: center; gap: 8px; margin: -6px 0 16px -10px; }
    .back-title h1 { font-size: 28px; }
    .empty-results { color: var(--sub); padding: 24px 0; font-size: 13px; }
    .help { grid-column: span 2; padding: 50px 20px; align-self: center; max-width: 590px; }
    .help h2 { font-size: 28px; line-height: 1.45; margin-bottom: 20px; }
    .help p { color: var(--sub); line-height: 1.9; margin-top: 12px; }
    @keyframes sheet-in { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes toast-in { from { opacity: 0; translate: 0 7px; } to { opacity: 1; translate: 0 0; } }
    @media (max-width: 1240px) { .phones { grid-template-columns: repeat(2, 375px); justify-content: center; } .help { grid-column: auto; } }
    @media (max-width: 820px) { body { padding: 25px 12px 45px; } .phones { grid-template-columns: minmax(0, 375px); gap: 30px; } .phone { width: 100%; } .intro { max-width: 375px; } .help { padding: 18px 8px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>

  </defs></svg>
  <header class="intro">
    <div><div class="eyebrow">조비안과 또이 · 한 장 일기 · v3</div><h1>고르는 순간은 또렷하게.<br>남기는 순간은 자유롭게.</h1><p>홈의 아이 카드를 눌러 한 장을 남겨 보세요.</p></div>
    <div class="theme-switch" aria-label="화면 테마"><button data-theme-choice="light" aria-pressed="false">라이트</button><button data-theme-choice="dark" aria-pressed="false">다크</button><button data-theme-choice="system" aria-pressed="true">시스템</button></div>
  </header>
  <main class="phones">
    <figure><figcaption><b>01 홈</b>오늘 누구의 하루를 남길까?</figcaption><div class="phone" id="home-phone"></div></figure>
    <figure><figcaption><b>02 일기 쓰기</b>조비안 · 벚꽃</figcaption><div class="phone" id="edit-phone"></div></figure>
    <figure><figcaption><b>03 일기 읽기 · 댓글</b>또이 · 박하</figcaption><div class="phone" id="saved-phone"></div></figure>
    <figure><figcaption><b>04 배지 고르기</b>작은 순간에 붙이는 스티커</figcaption><div class="phone" id="badge-phone"></div></figure>
    <figure><figcaption><b>05 그림 그리기</b>손가락으로, 자유롭게</figcaption><div class="phone" id="draw-phone"></div></figure>

    <figure><figcaption><b>07 설정</b>우리 가족에게 맞게</figcaption><div class="phone" id="settings-phone"></div></figure>
    <aside class="help"><div class="eyebrow">두 가지 화면, 하나의 흐름</div><h2>오늘의 아이를 고르고,<br>한 장에 마음껏 남겨요.</h2><p>홈과 달력은 단정하게. 아이의 일기는 색과 손글씨로 가득하게. 그림을 누르면 도구가 나타나고, 별을 누르면 배지를 고를 수 있어요.</p><p>저장하면 홈으로 돌아와 최근 기록 맨 앞에 놓여요.<br>이 목업에서 남긴 기록은 새로고침하면 사라져요.</p></aside>
  </main>
  <script>
    'use strict';
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
    const icon = name => `<svg class="icon" aria-hidden="true">
        <use href="#i-${name}"/>
        </svg>`;
    const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    const names = ['조비안', '또이'];
    const colors = ['cherry', 'apricot', 'lemon', 'pahha', 'lime', 'sky', 'lilac', 'paper', 'orange', 'tomato', 'forsythia', 'mint', 'blue', 'lavender', 'forest', 'night'];
    const colorNames = ['벚꽃', '살구', '레몬', '박하', '연두', '하늘', '라일락', '종이', '주황', '토마토', '개나리', '민트', '파랑', '라벤더', '숲', '밤'];
    const badges = [['vax', '예방접종'], ['fever', '열·아픔'], ['hospital', '병원'], ['star', '처음'], ['growth', '키·몸무게'], ['food', '수유·이유식'], ['moon', '수면'], ['med', '약'], ['baby', '산전검진']];
    const today = '2026-10-26';
    const states = new Map();
    const kids = [{ color: 'cherry', birth: '', due: '' }, { color: 'pahha', birth: '', due: '2026-11-29' }];
    let serial = 10;
    const pages = [
      { kid: 0, date: today, color: 'cherry', doodle: 'sock', text: '처음으로 혼자 양말 신음!\n왼발 오른발 바뀐 건 비밀.', second: '벗을 때는 아직 도와달라고 한다.', author: '아빠', badges: ['star'], comments: [{ author: '엄마', text: '내일도 혼자 도전해 보자 ♡' }], order: 5 },
      { kid: 1, date: today, color: 'pahha', doodle: 'heart', text: '산전검진 다녀온 날.\n또이 2.1kg, 잘 크고 있대요.', second: '만날 날이 점점 가까워진다.', author: '엄마', badges: ['baby'], comments: [{ author: '엄마', text: '발로 꾹꾹, 오늘도 힘차네.' }, { author: '아빠', text: '또이야, 천천히 건강하게 만나자 ♡' }], order: 4 },
      { kid: 0, date: '2026-10-25', color: 'lemon', doodle: 'sun', text: '아빠랑 공원에서 한 바퀴.', author: '아빠', badges: [], comments: [], order: 3 },
      { kid: 0, date: '2026-10-24', color: 'sky', doodle: 'sprout', text: '작은 도토리를 주워 왔다.', author: '엄마', badges: ['star'], comments: [], order: 2 },
      { kid: 1, date: '2026-10-22', color: 'lilac', doodle: 'heart', text: '목소리를 듣고 움직이는 너.', author: '아빠', badges: [], comments: [], order: 1 }
    ];
    function getPage(kid, date) {
      return pages.find(page => page.kid === kid && page.date === date);
    }
    function dateObject(date) {
      return new Date(`${date}T12:00:00+09:00`);
    }
    function shiftDate(date, amount) {
      const result = dateObject(date);
      result.setUTCDate(result.getUTCDate() + amount);
      return new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(result);
    }
    function dateLabel(date, long = false) {
      return new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', weekday: long ? 'long' : 'short' }).format(dateObject(date));
    }
    function ageLabel(kid, date) {
      if (kids[kid].birth) {
        const birth = dateObject(kids[kid].birth);
        const now = dateObject(date);
        const days = Math.max(0, Math.floor((now - birth) / 86400000));
        const months = Math.max(0, (now.getUTCFullYear() - birth.getUTCFullYear()) * 12 + now.getUTCMonth() - birth.getUTCMonth() - (now.getUTCDate() < birth.getUTCDate() ? 1 : 0));
        return months === 0 ? `생후 ${days}일` : months < 24 ? `${months}개월` : `${Math.floor(months / 12)}년 ${months % 12}개월`;
      }
      if (kids[kid].due) {
        const days = Math.round((dateObject(kids[kid].due) - dateObject(date)) / 86400000);
        return days > 0 ? `출산 전 · D-${days}` : days === 0 ? '출산 예정 D-day' : '출산 예정일 지남';
      }
      return kid ? '출산 전' : '';
    }
    function pageStyle(color) {
      return `--page-color:var(--${color})`;
    }
    function status() {
      return '<div class="status"><span>9:41</span><span class="island"></span><span>▴ ▴ ▰</span></div>';
    }
    function nav(active) {
      return `<nav class="tabbar" aria-label="주 메뉴">${[['home', '홈'], ['calendar', '달력'], ['settings', '설정']].map(([tab, label]) => `<button class="tab ${active === tab ? 'on' : ''}" data-nav="${tab}" ${active === tab ? 'aria-current="page"' : ''}>${icon(tab)}<span>${label}</span>
        </button>`).join('')}</nav>`;
    }
    function toast(phone, text) {
      $('.toast', phone)?.remove();
      const element = document.createElement('div');
      element.className = 'toast';
      element.role = 'status';
      element.textContent = text;
      phone.append(element);
      setTimeout(() => element.remove(), 2400);
    }
    function thumbnail(page) {
      return `<button class="page-card page-color" data-open="${page.kid}" data-date="${page.date}" data-color="${page.color}" style="${pageStyle(page.color)}" aria-label="${escapeHTML(`${dateLabel(page.date)} ${names[page.kid]} 기록 열기`)}">${miniArt(page)}${page.badges.length ? `<span class="mini-badge">${icon(page.badges[0])}</span>` : ''}<span class="card-label">
        <small>${page.date.slice(5).replace('-', '.')} · ${names[page.kid]}</small>
        <p>${escapeHTML(page.text.split('\n')[0] || '그림으로 남긴 하루')}</p>
        </span>
        </button>`;
    }
    // Inline SVG keeps saved drawings crisp and their ink adaptive in both themes.
    let maskSerial = 0;
    function miniArt(page, kidCard = false) {
      if (!page.photo && !page.strokes?.length) {
        return icon(page.doodle || 'pen').replace('class="icon"', `class="icon ${kidCard ? 'kid-art' : ''}"`);
      }
      let drawing = '';
      let masks = '';
      if (page.photo) drawing = `<image href="${escapeHTML(page.photo)}" x="49" y="52" width="240" height="230" preserveAspectRatio="xMidYMid meet"/>`;
      else if (page.doodle === 'sock') drawing = `<g transform="translate(98 59) rotate(-6.875) scale(1.35)" stroke-width="1.1">
        <use href="#i-sock" width="120" height="150"/>
        </g>`;
      else if (page.doodle) drawing = `<g transform="translate(103 85) rotate(4.01) scale(4.1)" stroke-width=".43">
        <use href="#i-${page.doodle}" width="32" height="32"/>
        </g>`;
      for (const stroke of page.strokes || []) {
        const points = stroke.points;
        let path = `M${points[0].x} ${points[0].y}`;
        for (let index = 1; index < points.length - 1; index++) {
          path += ` Q${points[index].x} ${points[index].y} ${(points[index].x + points[index + 1].x) / 2} ${(points[index].y + points[index + 1].y) / 2}`;
        }
        path += ` L${points.at(-1).x + .01} ${points.at(-1).y}`;
        const mark = `<path d="${path}" stroke-width="${stroke.size}"/>`;
        if (stroke.erase) {
          const id = `erase-${++maskSerial}`;
          masks += `<mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="338" height="335">
        <rect width="338" height="335" fill="white" stroke="none"/>
        <g stroke="black" fill="none">${mark}</g>
        </mask>`;
          drawing = `<g mask="url(#${id})">${drawing}</g>`;
        } else drawing += mark;
      }
      return `<svg class="drawing-preview ${kidCard ? 'kid-art' : ''}" viewBox="0 0 338 335" aria-hidden="true">
        <defs>${masks}</defs>${drawing}</svg>`;
    }
    function renderHome(phone, archive = false) {
      const previous = states.get(phone.id) || {};
      const state = { date: previous.homeDate || previous.date || today, filter: previous.filter ?? -1, query: previous.query || '', author: previous.author || '아빠', view: archive ? 'archive' : 'home' };
      states.set(phone.id, state);
      phone.innerHTML = `<section class="screen">${status()}<div class="scroll">${archive ? `<div class="back-title">
        <button data-home aria-label="홈으로">${icon('back')}</button>
        <h1>모든 기록</h1>
        </div>` : `<header class="home-head">
        <div>
        <p class="meta">${dateLabel(state.date, true)}</p>
        <h1 class="greeting">오늘, 아이들의 하루</h1>
        </div>
        <button class="avatar" aria-label="작성자 변경, 현재 ${state.author}">${state.author}</button>
        </header>
        <div class="date-switch">
        <button data-step="-1" aria-label="이전 날짜">${icon('left')}</button>
        <span>${state.date === today ? '오늘' : state.date.slice(5).replace('-', '.')}</span>
        <button data-step="1" aria-label="다음 날짜">${icon('right')}</button>${state.date !== today ? '<button data-today>오늘로</button>' : ''}</div>
        <div class="kids">${names.map((name, kid) => {
        const page = getPage(kid, state.date);
        const color = page?.color || kids[kid].color;
        return `<button class="kid-card page-color" data-open="${kid}" data-date="${state.date}" data-color="${color}" style="${pageStyle(color)}">${page ? miniArt(page, true) : icon(kid ? 'sprout' : 'pen').replace('class="icon"', 'class="icon kid-art empty-art"')}<h3>${name}</h3>
        <div class="age">${ageLabel(kid, state.date)}</div>
        <div class="kid-status">
        <span>${page ? `${state.date === today ? '오늘 ' : ''}기록 완료 · ${page.author}` : '아직 안 썼어요'}</span>${icon('right')}</div>
        </button>`;
      }).join('')}</div>`}<label class="search">${icon('search')}<input type="search" aria-label="기록 검색" placeholder="기록 검색" value="${escapeHTML(state.query)}">
        </label>${archive ? '' : '<div class="section-head"><h2>최근 기록</h2><button data-archive>전체 보기</button></div>'}<div class="segments" aria-label="아이 필터">${['전체', ...names].map((label, index) => `<button data-filter="${index - 1}" aria-pressed="${state.filter === index - 1}">${label}</button>`).join('')}</div>
        <div class="${archive ? 'archive-grid' : 'recent-row'}" data-results>
        </div>
        </div>${nav('home')}</section>`;
      const updateResults = () => {
        const results = [...pages].sort((a, b) => b.order - a.order).filter(page => (state.filter < 0 || state.filter === page.kid) && `${names[page.kid]} ${page.text} ${page.author}`.includes(state.query));
        $('[data-results]', phone).innerHTML = results.map(thumbnail).join('') || '<p class="empty-results">찾는 기록이 없어요.</p>';
      };
      updateResults();
      $('input[type="search"]', phone).oninput = event => {
        state.query = event.target.value;
        updateResults();
      };
      phone.onclick = event => {
        const button = event.target.closest('button');
        if (!button) return;
        if (button.hasAttribute('data-open')) openDiary(phone, Number(button.dataset.open), button.dataset.date, button);
        else if (button.hasAttribute('data-step')) {
          state.date = shiftDate(state.date, Number(button.dataset.step));
          renderHome(phone, archive);
        } else if (button.hasAttribute('data-today')) {
          state.date = today;
          renderHome(phone, archive);
        } else if (button.hasAttribute('data-filter')) {
          state.filter = Number(button.dataset.filter);
          renderHome(phone, archive);
        } else if (button.hasAttribute('data-archive')) renderHome(phone, true);
        else if (button.hasAttribute('data-home')) renderHome(phone);
        else if (button.classList.contains('avatar')) {
          state.author = state.author === '아빠' ? '엄마' : '아빠';
          button.textContent = state.author;
          button.setAttribute('aria-label', `작성자 변경, 현재 ${state.author}`);
        } else navigate(phone, button);
      };
    }
    function animateFrom(element, from) {
      if (!from || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const to = element.getBoundingClientRect();
      element.animate([
        { transformOrigin: '0 0', transform: `translate(${from.left - to.left}px, ${from.top - to.top}px) scale(${from.width / to.width}, ${from.height / to.height})`, borderRadius: '25px', opacity: .8 },
        { transformOrigin: '0 0', transform: 'none', borderRadius: '0', opacity: 1 }
      ], { duration: 250, easing: 'cubic-bezier(.2,.8,.2,1)' });
    }
    function openDiary(phone, kid, date, source) {
      const rect = source?.getBoundingClientRect();
      const previous = states.get(phone.id);
      const page = getPage(kid, date);
      const draft = page ? structuredClone(page) : { kid, date, color: kids[kid].color, doodle: null, text: '', author: previous?.author || '아빠', badges: [], comments: [], strokes: [] };
      states.set(phone.id, { view: 'diary', kid, date, draft, editing: true, drawing: false, pen: 2, erase: false, homeDate: previous?.homeDate || previous?.date || today, author: previous?.author || '아빠' });
      renderDiary(phone);
      animateFrom($('.diary', phone), rect);
    }
    function createDiary(phone, kid, options = {}) {
      states.set(phone.id, { view: 'diary', kid, date: today, draft: structuredClone(getPage(kid, today)), editing: !options.saved, drawing: !!options.drawing, pen: 2, erase: false, homeDate: today, author: '아빠' });
      renderDiary(phone);
      if (options.sheet) showSheet(phone, options.sheet);
    }
    function captureText(phone) {
      const state = states.get(phone.id);
      const editor = $('.note-editor', phone);
      if (editor) state.draft.text = editor.value;
      const second = $('[data-second-note]', phone);
      if (second) state.draft.second = second.value;
    }
    function renderDiary(phone) {
      const state = states.get(phone.id);
      const page = state.draft;
      const weekday = new Intl.DateTimeFormat('ko-KR', { weekday: 'short', timeZone: 'Asia/Seoul' }).format(dateObject(page.date));
      phone.innerHTML = `<section class="screen diary page-color" data-color="${page.color}" style="${pageStyle(page.color)}">${status()}<header class="diary-head">
        <button data-back aria-label="홈으로 돌아가기">${icon('back')}</button>
        <div class="diary-date">
        <button data-diary-step="-1" aria-label="이전 날짜">${icon('left')}</button>
        <span>${page.date.slice(5).replace('-', '.')} ${weekday}</span>
        <button data-diary-step="1" aria-label="다음 날짜">${icon('right')}</button>
        </div>
        <button class="badge-button ${page.badges.length ? 'chosen' : ''}" data-sheet="badges" aria-label="배지 ${page.badges.length}개, 배지 고르기">${icon('star')}${page.badges.length ? `<span class="badge-count">${page.badges.length}</span>` : ''}</button>
        </header>
        <div class="art ${state.drawing ? 'drawing' : ''} ${!page.doodle && !page.strokes?.length && !page.photo ? 'empty' : ''}">
        <canvas aria-label="${names[page.kid]}의 그림, 눌러서 그리기" tabindex="0">
        </canvas>${state.drawing ? drawingTray(state) : ''}</div>
        <div class="writing">
        <div class="notes">
        <div class="note-block ${page.author === '엄마' ? 'mom-writing' : 'dad-writing'}">${state.editing ? `<textarea class="note-editor" aria-label="${names[page.kid]}의 일기" placeholder="오늘 ${names[page.kid]}은…" spellcheck="false">${escapeHTML(page.text)}</textarea>

          input.click();
        } else showSettingsSheet(phone, action);
      };
    }
    function validPage(page) {
      return page && [0, 1].includes(page.kid) && /^\d{4}-\d{2}-\d{2}$/.test(page.date)
        && !Number.isNaN(dateObject(page.date).valueOf()) && colors.includes(page.color)
        && typeof page.text === 'string' && typeof page.author === 'string'
        && (!page.second || typeof page.second === 'string') && Number.isFinite(page.order)
        && Array.isArray(page.badges) && page.badges.every(badge => badges.some(([id]) => id === badge))
        && Array.isArray(page.comments) && page.comments.every(comment => typeof comment.text === 'string' && typeof comment.author === 'string')
        && (!page.doodle || ['sock', 'heart', 'sun', 'sprout', 'pen'].includes(page.doodle))
        && (!page.photo || /^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(page.photo))
        && (!page.strokes || Array.isArray(page.strokes) && page.strokes.every(stroke => Number.isFinite(stroke.size) && stroke.size > 0 && Array.isArray(stroke.points) && stroke.points.length && stroke.points.every(point => Number.isFinite(point.x) && Number.isFinite(point.y))));
    }
    function showSettingsSheet(phone, action) {
      const kid = action === 'kid1' ? 1 : 0;
      const isKid = action.startsWith('kid');
      const layer = document.createElement('div');
      layer.className = 'sheet-layer';
      const background = $('.screen', phone);
      background.inert = true;
      layer.innerHTML = `<section class="sheet" role="dialog" aria-modal="true" aria-label="${isKid ? names[kid] : '모든 페이지 색'}">
        <div class="handle">
        </div>
        <div class="sheet-head">
        <h3>${isKid ? names[kid] : '모든 페이지 색'}</h3>
        <button class="primary" data-close>완료</button>
        </div>${isKid ? `<label class="setting">생일<input type="date" class="setting-select" data-birth aria-label="생일" value="${kids[kid].birth}">
        </label>${kid ? `<label class="setting">출산 예정일<input type="date" class="setting-select" data-due aria-label="출산 예정일" value="${kids[kid].due}">
        </label>` : ''}<p class="meta" style="margin:16px 0 8px">기본 페이지 색</p>` : '<p class="meta">고르면 기존 모든 페이지에 적용돼요.</p>'}<div class="palette">${colors.map((color, index) => `<button class="swatch" data-color-setting="${color}" aria-pressed="${isKid && kids[kid].color === color}">
        <span class="swatch-dot" data-color="${color}" style="${pageStyle(color)}">${isKid && kids[kid].color === color ? '✓' : ''}</span>
        <span>${colorNames[index]}</span>
        </button>`).join('')}</div>
        </section>`;
      phone.append(layer);
      const close = () => {
        layer.remove();
        renderSettings(phone);
        refreshShells(phone);
      };
      $('[data-close]', layer).focus({ preventScroll: true });
      if (isKid) {
        $('[data-birth]', layer).onchange = event => { kids[kid].birth = event.target.value; };
        if (kid) $('[data-due]', layer).onchange = event => { kids[kid].due = event.target.value; };
      }
      layer.onclick = event => {
        event.stopPropagation();
        const button = event.target.closest('button');
        if (event.target === layer || button?.hasAttribute('data-close')) close();
        else if (button?.dataset.colorSetting) {
          const color = button.dataset.colorSetting;
          if (isKid) kids[kid].color = color;
          else {
            pages.forEach(page => { page.color = color; });
            for (const [id, state] of states) {
              if (state.view !== 'diary') continue;
              state.draft.color = color;
              captureText(document.getElementById(id));
              renderDiary(document.getElementById(id));
            }
          }
          $$('.swatch', layer).forEach(swatch => {
            swatch.setAttribute('aria-pressed', String(swatch === button));
            $('.swatch-dot', swatch).textContent = swatch === button ? '✓' : '';
          });
          refreshShells(phone);
        }
      };
      trapSheet(layer, close);
    }
    function navigate(phone, button) {
      if (button.dataset.nav === 'home') renderHome(phone);
      if (button.dataset.nav === 'calendar') renderCalendar(phone);
      if (button.dataset.nav === 'settings') renderSettings(phone);
    }
    function setTheme(theme) {
      if (theme === 'system') delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = theme;
      $$('[data-theme-choice]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.themeChoice === theme)));
      $$('.setting-select[aria-label="화면 테마"]').forEach(select => { select.value = theme; });
      for (const state of states.values()) state.redraw?.();
    }
    $$('[data-theme-choice]').forEach(button => { button.onclick = () => setTheme(button.dataset.themeChoice); });
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (!document.documentElement.dataset.theme) for (const state of states.values()) state.redraw?.();
    });
    renderHome($('#home-phone'));
    createDiary($('#edit-phone'), 0);
    createDiary($('#saved-phone'), 1, { saved: true, sheet: 'comments' });
    createDiary($('#badge-phone'), 0, { sheet: 'badges' });
    createDiary($('#draw-phone'), 0, { drawing: true });
    renderCalendar($('#calendar-phone'));
    renderSettings($('#settings-phone'));
  </script>
</body>
</html>
