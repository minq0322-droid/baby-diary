<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>민들레 들판 · 낮 홈 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root { color-scheme: light; --bg: #f5f4f0; --surface: #fffefa; --text: #514b56; --sub: #8b818b; --line: #e6dfe3; --mint: #f7ddd1; --shadow: #977b9620; }
* { box-sizing: border-box; }
html { overflow-x: clip; }
body { margin: 0; padding: 42px 16px 70px; background: var(--bg); color: var(--text); font: 15px/1.55 Pretendard, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; min-width: 44px; min-height: 44px; padding: 10px; touch-action: manipulation; word-break: keep-all; }
button:focus-visible { outline: 3px solid #b88758; outline-offset: 4px; }
p { margin: 0; word-break: keep-all; }

main{
  display:flex;
  align-items:center;
  flex-direction:column;
  gap:38px}

figure{
  margin:0;
  width:375px;
  max-width:100%}

figcaption{
  font-size:12px;
  color:var(--sub);
  margin:0 0 10px 8px;
  letter-spacing:.025em}

.phone{
  position:relative;
  width:375px;
  height:812px;
  max-width:100%;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:39px;
  background:var(--mint);
  isolation:isolate;
  box-shadow:0 22px 70px var(--shadow)}

.home{
  position:absolute;
  inset:0;
  overflow:hidden}

.date{
  position:absolute;
  top:68px;
  left:0;
  right:0;
  text-align:center;
  font-size:13px;
  letter-spacing:.06em;
  z-index:2}

.status{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:43px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 25px 0;
  font-size:11px;
  z-index:8;
  pointer-events:none}

.status b{
  font-size:12px}

.island{
  position:absolute;
  left:50%;
  top:12px;
  width:82px;
  height:19px;
  background:currentColor;
  border-radius:24px;
  transform:translateX(-50%);
  opacity:.85}

.homebar{
  position:absolute;
  bottom:max(9px,env(safe-area-inset-bottom));
  left:calc(50% - 54px);
  height:4px;
  width:108px;
  background:currentColor;
  opacity:.28;
  border-radius:5px;
  z-index:12;
  pointer-events:none}

.photo{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  display:block}

.portrait{
  border-radius:50%;
  overflow:hidden;
  display:block}

.options{
  display:flex;
  justify-content:center;
  gap:4px;
  margin-bottom:14px}

.options button{
  font-size:12px;
  border-radius:24px;
  border:1px solid var(--line)}

.options [aria-pressed=true]{
  background:var(--text);
  color:var(--bg)}

.record-bubble { position: absolute; left: 50%; bottom: calc(100% + 10px); width: max-content; max-width: 240px; transform: translateX(-50%); border: 1px solid #fff0c84d; border-radius: 18px; padding: 9px 13px; color: #fff4d8; background: #253b3bf2; box-shadow: 0 5px 18px #10232230; font-size: 12px; opacity: 0; pointer-events: none; }

.record-bubble.visible { opacity: 1; }

.record-bubble::after { content: ''; position: absolute; bottom: -5px; left: calc(50% - 4px); width: 8px; height: 8px; background: #253b3b; transform: rotate(45deg); }
header { max-width: 690px; margin: 0 auto 22px; }
.eyebrow { color: var(--sub); font-size: 11px; letter-spacing: .12em; }
.options { justify-content: flex-start; gap: 6px; margin: 14px 0 0; flex-wrap: wrap; }
.options button { padding: 7px 16px; background: #fffefa80; }
.options [aria-pressed=true] { background: var(--text); }
main { gap: 0; }
.phone { container-type: inline-size; }
.home { background: var(--scene); }
.scene { position: absolute; left: 50%; top: 50%; width: 375px; height: 812px; transform: translate(-50%, -50%) scale(var(--scene-scale, 1)); transform-origin: center; }
.landscape { position: absolute; inset: 0; width: 375px; height: 812px; pointer-events: none; }
.date { color: var(--scene-ink); top: 68px; padding-top: env(safe-area-inset-top); }
.status, .homebar { color: var(--scene-ink); }
.kid { position: absolute; width: var(--w); height: var(--h); left: var(--x); top: var(--y); animation: float 12s ease-in-out infinite alternate; }
.kid.second { animation-delay: -7s; animation-duration: 15s; }
.kid-art { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.face { position: absolute; left: var(--fx); top: var(--fy); width: var(--size); height: var(--size); padding: 0; border-radius: 50%; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
/* C-1 circular photo slot and its original sphere lighting. */
.face .portrait { position: relative; width: 100%; height: 100%; isolation: isolate; border: 1px solid #fff1ba9c; box-shadow: 0 0 9px #fff2b677, 0 0 30px var(--halo), 0 0 65px var(--halo), 7px 12px 22px #22362f30; }
.face .portrait::after { content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 26% 22%, #fffbe45c, transparent 48%), radial-gradient(circle at 28% 26%, transparent 38%, #79501e26 72%, #2d281a91 100%); box-shadow: inset 2px 2px 5px #fff9dbb3, inset -6px -8px 13px #49362355; }
.face .portrait { border: 3px solid var(--kid-color); background: var(--kid-color); }
.record-bubble { z-index: 10; color: #fff4e5; }
.nav { position: absolute; z-index: 4; bottom: max(36px, calc(env(safe-area-inset-bottom) + 22px)); left: 0; right: 0; display: flex; justify-content: center; gap: 29px; color: var(--scene-ink); }
.nav button { width: 48px; padding: 5px 0; display: flex; align-items: center; flex-direction: column; gap: 4px; font-size: 10px; opacity: .9; }
.nav svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
.nav button:hover { opacity: 1; }
.hill { transform-origin: center bottom; animation: hill-drift 22s ease-in-out infinite alternate; }
.hill.near { animation-delay: -9s; animation-duration: 27s; }
.cloud { animation: cloud-drift 30s ease-in-out infinite alternate; }
.cloud.far { animation-delay: -14s; animation-duration: 39s; }
.bird { animation: glide 25s ease-in-out infinite alternate; }
.grass { transform-origin: center bottom; animation: grass-sway 7s ease-in-out infinite alternate; }
.grass.back { animation-delay: -3s; animation-duration: 9s; }
.drifting-seed { animation: seed-drift 24s ease-in-out infinite; }
.drifting-seed.other { animation-delay: -11s; }
.sunset { --scene: radial-gradient(ellipse at 17% 34%, #fff0bd88, transparent 49%), linear-gradient(180deg, #c8bcd8, #f1c3cd 38%, #ffdbb3 65%, #d5a3b0); --scene-ink: #674b65; }
.sunset .kid { animation-name: breathe; }
.sunset .nav { color: #42364f; }
.balloon { --scene: radial-gradient(ellipse at 25% 20%, #fcfcfbaa, transparent 55%), linear-gradient(180deg, #b7d7e8, #e1edf0 62%, #f4eadb); --scene-ink: #486679; }
.balloon .face .portrait { box-shadow: 0 3px 15px #9e7e7920, inset 0 0 8px #fff9; }
.dandelion { --scene: radial-gradient(ellipse at 22% 24%, #fffbd699, transparent 52%), linear-gradient(180deg, #c9dfd1, #e5ead0 51%, #a9c898); --scene-ink: #4a6659; }
.dandelion .kid { animation-name: head-sway; transform-origin: 50% 100%; }
.dandelion .nav { color: #2c493e; }
.still *, .still *::before, .still *::after { animation-play-state: paused !important; }
@keyframes float { from { transform: translateY(0) rotate(-1deg); } to { transform: translateY(-8px) rotate(1deg); } }
@keyframes breathe { from { transform: translateY(0); } to { transform: translateY(-3px); } }
@keyframes hill-drift { from { transform: translateX(-2px); } to { transform: translateX(2px); } }
@keyframes cloud-drift { from { transform: translateX(-9px); } to { transform: translateX(12px); } }
@keyframes glide { from { transform: translate(-10px, 2px); } to { transform: translate(20px, -5px); } }
@keyframes grass-sway { from { transform: skewX(-1deg); } to { transform: skewX(1.5deg); } }
@keyframes head-sway { from { transform: rotate(-.7deg); } to { transform: rotate(.7deg); } }
@keyframes seed-drift { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 15%, 75% { opacity: .7; } 100% { transform: translate(42px, -65px) rotate(22deg); opacity: 0; } }
@media (max-width: 410px) { body { padding: 24px 8px 50px; } header { padding-inline: 12px; } .phone { border-radius: 30px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } .drifting-seed { opacity: .55; } }

.tab-hidden *, .tab-hidden *::before, .tab-hidden *::after { animation-play-state: paused !important; }
</style>
</head>

<script>
function illustration(kid, variant = 0) {
  const bg = kid ? ['#d8e8c9', '#f3ddc6', '#d7e7eb'][variant % 3] : ['#f2d4bd', '#e4dded', '#d9e7d7'][variant % 3];
  return '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200"><rect width="200" height="200" fill="' + bg + '"/><ellipse cx="100" cy="205" rx="65" ry="53" fill="' + (kid ? '#f6f0dd' : '#8ca8a0') + '"/>' + (kid ? '<path d="M67 62C97 26 143 55 139 95C157 139 125 164 91 157C54 151 43 106 67 62Z" fill="#f9e2c7"/><path d="M99 52q-6-22 9-23q15 3 0 12" fill="none" stroke="#8a7056" stroke-width="4" stroke-linecap="round"/>' : '<ellipse cx="100" cy="103" rx="59" ry="65" fill="#f6dcc1"/><path d="M42 89C30 36 69 25 105 30C146 24 164 61 155 93L140 75L130 57L112 69L100 54L79 71L66 62L53 86Z" fill="#4d4941"/>') + '<path d="M73 102q5-6 10 0M117 102q5-6 10 0" fill="none" stroke="#655344" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="67" cy="118" rx="10" ry="6" fill="#ecb0a1" opacity=".55"/><ellipse cx="134" cy="118" rx="10" ry="6" fill="#ecb0a1" opacity=".55"/><path d="M91 125q9 10 18 0" fill="none" stroke="#ad7565" stroke-width="3" stroke-linecap="round"/>' + (kid ? '<path d="M89 165l11 12 12-12" fill="none" stroke="#ccb98e" stroke-width="3"/>' : '<path d="M85 165l15 16 15-16" fill="none" stroke="#eef1dc" stroke-width="4"/>') + '</svg>';
}
const names = ['조비안', '또이'];
const counts = [18, 7];
const colors = ['#F4B9B8', '#CDEFE2'];
document.querySelectorAll('.face').forEach((face, kid) => {
  // Exact C-1 drawing; only the illustration's paper background takes the page color.
  const art = illustration(kid).replace(/(<rect width="200" height="200" fill=")[^"]+/, '$1' + colors[kid]);
  face.querySelector('img').src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(art);
  const summary = '최근 30일 중 ' + counts[kid] + '일 기록';
  face.setAttribute('aria-label', names[kid] + ', ' + summary);
  const bubble = face.querySelector('.record-bubble');
  bubble.textContent = summary;
  let holdTimer;
  let bubbleTimer;
  let pointerStart;
  const showBubble = () => {
    clearTimeout(bubbleTimer);
    bubble.classList.add('visible');
    bubbleTimer = setTimeout(() => bubble.classList.remove('visible'), 2000);
  };
  face.addEventListener('pointerenter', event => { if (event.pointerType === 'mouse') showBubble(); });
  face.addEventListener('focus', showBubble);
  face.addEventListener('pointerdown', event => {
    pointerStart = { x: event.clientX, y: event.clientY };
    holdTimer = setTimeout(showBubble, 550);
  });
  face.addEventListener('pointermove', event => {
    if (pointerStart && Math.hypot(event.clientX - pointerStart.x, event.clientY - pointerStart.y) > 10) clearTimeout(holdTimer);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(type => face.addEventListener(type, () => {
    clearTimeout(holdTimer);
    pointerStart = null;
  }));
  face.addEventListener('contextmenu', event => event.preventDefault());
});
// Scale the whole illustration together, preserving circles and all thirty marks at 320px.
new ResizeObserver(([entry]) => {
  document.querySelector('.scene').style.setProperty('--scene-scale', Math.min(1, entry.contentRect.width / 375));
}).observe(document.querySelector('.home'));
document.querySelectorAll('[data-motion]').forEach(button => button.addEventListener('click', () => {
  document.querySelector('.phone').classList.toggle('still', button.dataset.motion === 'still');
  document.querySelectorAll('[data-motion]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
}));
document.addEventListener('visibilitychange', () => {
  document.querySelector('.scene').style.animationPlayState = document.hidden ? 'paused' : '';
